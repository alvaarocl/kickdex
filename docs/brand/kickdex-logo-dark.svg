<svg width="560" height="160" viewBox="0 0 560 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KICKDEX logo">
  <rect width="560" height="160" rx="24" fill="#05070D"/>

  <!-- Grid hairlines -->
  <g stroke="#2EE6A6" stroke-width="1" opacity="0.06">
    <line x1="0" y1="40" x2="560" y2="40"/>
    <line x1="0" y1="80" x2="560" y2="80"/>
    <line x1="0" y1="120" x2="560" y2="120"/>
    <line x1="180" y1="0" x2="180" y2="160"/>
    <line x1="380" y1="0" x2="380" y2="160"/>
  </g>

  <!-- Symbol tile -->
  <rect x="32" y="32" width="96" height="96" rx="20" fill="#2EE6A6"/>
  <path d="M52 58H108M52 102H108M80 48V112" stroke="#021A12" stroke-width="2" stroke-linecap="round" opacity=".25"/>
  <text x="59" y="103" fill="#021A12" font-family="IBM Plex Mono, JetBrains Mono, monospace" font-size="58" font-weight="800">K</text>
  <rect x="100" y="98" width="14" height="6" rx="2" fill="#021A12"/>

  <!-- Wordmark unified -->
  <text x="156" y="92" fill="#F1F5FB" font-family="IBM Plex Mono, JetBrains Mono, monospace" font-size="46" font-weight="700" letter-spacing="-1">kickdex</text>
  <rect x="380" y="60" width="14" height="38" fill="#2EE6A6">
    <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="158" y="120" fill="#8A94AB" font-family="Inter, IBM Plex Sans, system-ui, sans-serif" font-size="14" letter-spacing="0.5">Football intelligence, indexed.</text>
</svg>
