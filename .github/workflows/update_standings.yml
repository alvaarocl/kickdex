name: Update Standings & Scorers

# Clasificación y máximos goleadores vía football-data.org. Cadencia diaria
# (no comparte el límite de 10 peticiones/min con update_live_scores.yml,
# se lanza a otra hora) — una tabla de posiciones no cambia salvo que se
# juegue una jornada, así que no necesita el refresco de 15 min del directo.

on:
  schedule:
    - cron: '20 5 * * *'  # Diario a las 5:20 UTC
  workflow_dispatch:

concurrency:
  group: update-standings
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update standings and scorers (delayed)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/update_standings.py

      - name: Commit updated standings and scorers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/standings.json docs/data/scorers.json
          git diff --staged --quiet || git commit -m "chore: update standings/scorers $(date -u +%Y-%m-%d) [skip ci]"
          git push
