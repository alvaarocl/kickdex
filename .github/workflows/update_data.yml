name: Update Data

on:
  schedule:
    - cron: '10 6 * * *'   # Diario a las 6:10 UTC
    - cron: '10 13 * * *'  # Refresco diario a las 13:10 UTC
  workflow_dispatch:

concurrency:
  group: update-data-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update referee data
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python scripts/update_referee_data.py --days-back 7

      - name: Build static data
        env:
          KICKDEX_SKIP_PLAYER_DOWNLOADS: "1"
        run: python scripts/build_data.py

      - name: Update player data
        run: python scripts/update_player_data.py --skip-scrape

      - name: Check player coverage
        run: python scripts/check_player_coverage.py --fail-under 1.0 --required-leagues SP1 E0 I1 D1 F1

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update data $(date -u +%Y-%m-%d) [skip ci]"
          git push
