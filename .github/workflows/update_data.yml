name: Update Data

on:
  schedule:
    - cron: '0 6 * * *'    # Diario a las 6:00 UTC (resultados noche anterior)
    - cron: '0 6 * * 3'    # Miércoles extra: jornadas europeas entre semana
  workflow_dispatch:         # Lanzado manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests
          pip install soccerdata || echo "soccerdata optional — jugadores usarán datos existentes"

      - name: Build static data
        run: python scripts/build_data.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update data $(date -u +%Y-%m-%d) [skip ci]"
          git push
