name: Update Data

on:
  schedule:
    - cron: '0 6 * * *'    # Diario a las 6:00 UTC
    - cron: '0 6 * * 3'    # Miercoles extra
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static data
        run: python scripts/build_data.py

      - name: Update player data
        run: python scripts/update_player_data.py

      - name: Check player coverage
        run: python scripts/check_player_coverage.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update data $(date -u +%Y-%m-%d) [skip ci]"
          git push
