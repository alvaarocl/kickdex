name: Update Data

on:
  schedule:
    - cron: '10 6 * * *'   # Diario a las 6:10 UTC
    - cron: '10 13 * * *'  # Refresco diario a las 13:10 UTC
  workflow_dispatch:
    inputs:
      referee_days_back:
        description: 'Days back to fetch referee data from API-Football'
        required: false
        default: '14'
      referee_max_fixtures:
        description: 'Max new fixtures to enrich with referee stats'
        required: false
        default: '70'
      referee_leagues:
        description: 'League codes to fetch referee data for'
        required: false
        default: 'SP1 SP2'

concurrency:
  group: update-data-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update referee data
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY || secrets.API_FOOTBALL_KEY }}
          REFEREE_DAYS_BACK: ${{ github.event.inputs.referee_days_back || '14' }}
          REFEREE_MAX_FIXTURES: ${{ github.event.inputs.referee_max_fixtures || '70' }}
          REFEREE_LEAGUES: ${{ github.event.inputs.referee_leagues || 'SP1 SP2' }}
        run: python scripts/update_referee_data.py --days-back "$REFEREE_DAYS_BACK" --max-fixtures "$REFEREE_MAX_FIXTURES" --leagues $REFEREE_LEAGUES

      - name: Update referee season aggregates
        run: python scripts/update_worldsoccerdata_referee_data.py --sleep 0.25 --timeout 45 --concurrency 2

      - name: Build static data
        env:
          KICKDEX_SKIP_PLAYER_DOWNLOADS: "1"
        run: python scripts/build_data.py

      - name: Update player data
        run: python scripts/update_player_data.py --skip-scrape

      - name: Check player coverage
        run: python scripts/check_player_coverage.py --fail-under 1.0 --required-leagues SP1 E0 I1 D1 F1

      - name: Check referee coverage
        run: python scripts/check_referee_coverage.py --fail-under 10 --required-leagues SP1 SP2 E0 E1 I1 D1 F1 N1

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          test ! -f DATOS/referees_matches.csv || git add DATOS/referees_matches.csv
          test ! -f DATOS/referees_season.csv || git add DATOS/referees_season.csv
          git diff --staged --quiet || git commit -m "chore: update data $(date -u +%Y-%m-%d) [skip ci]"
          git push
